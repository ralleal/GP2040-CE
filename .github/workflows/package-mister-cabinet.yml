name: Package MiSTer cabinet source and firmware

on:
  push:
    branches:
      - mister-cabinet
    paths:
      - '.github/workflows/package-mister-cabinet.yml'
      - 'configs/WaveshareZero/BoardConfig.h'
      - 'headers/drivers/keyboard/KeyboardDriver.h'
      - 'headers/drivers/keyboard/KeyboardDescriptors.h'
      - 'src/drivers/keyboard/KeyboardDriver.cpp'
      - 'scripts/generate_mister_kbd_map.py'
      - 'tests/test_mister_kbd_map.py'
      - 'README.md'
      - 'README_MiSTerCabinet-Custom.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  call-node-workflow:
    uses: ./.github/workflows/node.js.yml

  build-package:
    needs: call-node-workflow
    runs-on: ubuntu-22.04

    steps:
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.17.x"

      - name: Checkout current source
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Validate MiSTer keyboard map
        run: python3 tests/test_mister_kbd_map.py

      - name: Setup Pico SDK pipeline
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Download web build artifact
        uses: actions/download-artifact@v4.1.2
        with:
          name: fsData
          path: ${{ github.workspace }}/lib/httpd/

      - name: Configure WaveshareZero build
        shell: bash
        run: |
          PICO_SDK_PATH="${{ github.workspace }}/pico-sdk" \
          GP2040_BOARDCONFIG=WaveshareZero \
          SKIP_WEBBUILD=TRUE \
          cmake -B "${{ github.workspace }}/build-mister-cabinet" \
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}"

      - name: Build WaveshareZero firmware
        shell: bash
        run: |
          GP2040_BOARDCONFIG=WaveshareZero \
          cmake --build "${{ github.workspace }}/build-mister-cabinet" \
            --config "${{ env.BUILD_TYPE }}" \
            --parallel 2

      - name: Build distribution ZIP
        shell: bash
        run: |
          set -eu

          ROOT="GP2040-CE-MiSTer-Cabinet"
          UF2_SOURCE="$(find build-mister-cabinet -maxdepth 1 -type f -name 'GP2040-CE_*_WaveshareZero.uf2' -print -quit)"
          UF2_NAME="GP2040-CE_v0.7.12_WaveshareZero_MiSTerCabinet-Custom.uf2"

          test -n "$UF2_SOURCE"

          rm -rf "$ROOT"
          mkdir -p "$ROOT/source" "$ROOT/firmware" "$ROOT/config"

          rsync -a \
            --exclude='.git' \
            --exclude='build-mister-cabinet' \
            --exclude="$ROOT" \
            ./ "$ROOT/source/"

          cp "$UF2_SOURCE" "$ROOT/firmware/$UF2_NAME"

          python3 scripts/generate_mister_kbd_map.py "$ROOT/config/kbd_cafe_0001.map"
          KBD_SHA256="$(sha256sum "$ROOT/config/kbd_cafe_0001.map" | awk '{print $1}')"

          UF2_SHA256="$(sha256sum "$ROOT/firmware/$UF2_NAME" | awk '{print $1}')"

          cat > "$ROOT/BUILD_INFO.txt" <<EOF
          GP2040-CE MiSTer cabinet package
          Source branch: mister-cabinet
          Source commit: ${{ github.sha }}
          Firmware target: WaveshareZero
          Firmware file: $UF2_NAME
          Firmware SHA256: $UF2_SHA256
          Keyboard map file: config/kbd_cafe_0001.map
          Keyboard map install path: /media/fat/config/kbd_cafe_0001.map
          Keyboard map SHA256: $KBD_SHA256
          Base firmware: GP2040-CE v0.7.12
          USB product name: GP2040-CE - Fixed Arcade Buttons
          Build workflow run: ${{ github.run_id }}
          EOF

          rm -f GP2040-CE-MiSTer-Cabinet-source-and-firmware.zip
          zip -r -q GP2040-CE-MiSTer-Cabinet-source-and-firmware.zip "$ROOT"

      - name: Verify packaged keyboard map
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import zipfile
          from pathlib import Path
          from scripts.generate_mister_kbd_map import generate_map

          root = "GP2040-CE-MiSTer-Cabinet"
          with zipfile.ZipFile(root + "-source-and-firmware.zip") as package:
              data = package.read(root + "/config/kbd_cafe_0001.map")
              assert data == generate_map(), "Packaged keyboard map differs from generator"
              assert len(data) == 256
              info = package.read(root + "/BUILD_INFO.txt").decode()
              assert "Keyboard map SHA256: " + hashlib.sha256(data).hexdigest() in info
              assert package.read(root + "/source/scripts/generate_mister_kbd_map.py") == Path("scripts/generate_mister_kbd_map.py").read_bytes()
          PYTHON

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GP2040-CE-MiSTer-Cabinet-source-and-firmware
          path: GP2040-CE-MiSTer-Cabinet-source-and-firmware.zip
          if-no-files-found: error
          retention-days: 90
